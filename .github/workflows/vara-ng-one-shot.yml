name: Vara NG One Shot Build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/vara-ng-one-shot.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Source
        uses: actions/checkout@v4
        with:
          repository: Saeiddvc/SaeidVPN-Android
          ref: 3ada2249a5f77233bbadf8edfb5a5d3f24064099
          token: ${{ secrets.VARA_PRIVATE_REPO_PAT }}
          fetch-depth: 1

      - name: Verify exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Checked out SHA: $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "3ada2249a5f77233bbadf8edfb5a5d3f24064099"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            CT="$SDK_ROOT/cmdline-tools/latest/bin"
          else
            CT="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 2 -type d -name bin 2>/dev/null | sort -V | tail -1)"
          fi
          test -n "$CT"
          yes | "$CT/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$CT/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Bootstrap Gradle wrapper
        shell: bash
        run: bash bootstrap.sh

      - name: Build debug APK
        shell: bash
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Verify APK contents
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find androidApp/build/outputs/apk/debug -name '*.apk' -type f | head -1)"
          test -n "$APK"
          echo "APK=$APK"
          SIZE="$(stat -c%s "$APK")"
          echo "APK_SIZE=$SIZE"
          test "$SIZE" -gt 100000000
          unzip -l "$APK" > /tmp/apk-files.txt
          grep -q 'libbox.so' /tmp/apk-files.txt
          grep -q 'libwg-go.so' /tmp/apk-files.txt
          echo "APK sanity: libbox + WireGuard native runtimes present"

      - name: Prepare emulator smoke script
        shell: bash
        run: |
          cat > /tmp/vara-emulator-smoke.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          APK="$(find "$GITHUB_WORKSPACE/androidApp/build/outputs/apk/debug" -name '*.apk' -type f | head -1)"
          test -n "$APK"
          test -s "$APK"
          echo "Installing $APK"
          adb install -r "$APK"
          adb shell pm grant com.vara.ng android.permission.POST_NOTIFICATIONS || true
          adb shell am start -n com.vara.ng/com.vara.ng.android.MainActivity
          sleep 7
          mkdir -p ui-smoke
          adb shell pidof com.vara.ng
          adb shell dumpsys window windows | grep -E 'mCurrentFocus|mFocusedApp' > ui-smoke/window-focus.txt
          grep -q 'com.vara.ng' ui-smoke/window-focus.txt
          adb exec-out screencap -p > ui-smoke/home.png
          test -s ui-smoke/home.png
          adb shell input tap 540 620
          sleep 2
          adb shell pidof com.vara.ng
          adb exec-out screencap -p > ui-smoke/after-center-tap.png
          test -s ui-smoke/after-center-tap.png
          adb shell dumpsys activity top > ui-smoke/activity-top.txt
          EOF
          chmod +x /tmp/vara-emulator-smoke.sh

      - name: Emulator UI smoke and screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          script: bash /tmp/vara-emulator-smoke.sh

      - name: Upload UI smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: vara-ui-smoke-3ada2249
          path: ui-smoke/
          if-no-files-found: error

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: Saeiddvc/Vara-NG-Build
        shell: bash
        run: |
          set -euo pipefail
          SHORT="3ada2249"
          mkdir -p release
          SRC="$(find androidApp/build/outputs/apk/debug -name '*.apk' -type f | head -1)"
          test -n "$SRC"
          APK="release/Vara-NG-Alpha-${SHORT}.apk"
          cp "$SRC" "$APK"
          (cd release && sha256sum *.apk > SHA256SUMS.txt)
          TAG="vara-ng-alpha-${SHORT}"
          gh release delete "$TAG" --repo "$GH_REPO" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" --repo "$GH_REPO" --target main             --title "Vara NG Alpha — ${SHORT}"             --notes "Built and emulator-smoke-tested from private source 3ada2249a5f77233bbadf8edfb5a5d3f24064099."             --prerelease "$APK" release/SHA256SUMS.txt
