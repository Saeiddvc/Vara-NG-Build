name: Vara NG Device Gate Build

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA on SaeidVPN-Android'
        required: true
        type: string
      ref:
        description: 'Source branch (informational)'
        required: true
        default: 'v2/main'
        type: string

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Private Source
        uses: actions/checkout@v4
        with:
          repository: Saeiddvc/SaeidVPN-Android
          ref: ${{ inputs.sha }}
          token: ${{ secrets.VARA_PRIVATE_REPO_PAT }}
          fetch-depth: 1

      - name: Verify exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Checked out SHA: $ACTUAL_SHA"
          test "$ACTUAL_SHA" = "${{ inputs.sha }}" || {
            echo "::error::SHA mismatch: expected ${{ inputs.sha }}, got $ACTUAL_SHA"
            exit 1
          }

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            CT="$SDK_ROOT/cmdline-tools/latest/bin"
          else
            CT="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 2 -type d -name bin 2>/dev/null | sort -V | tail -1)"
          fi
          test -n "$CT"
          echo "$CT" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$CT/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$CT/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Bootstrap Gradle wrapper
        shell: bash
        run: bash bootstrap.sh

      - name: Diagnostic - Resolve libbox from Gradle configuration
        shell: bash
        run: |
          set -uo pipefail

          echo "### Run Gradle task to enumerate real classpath ###"
          ./gradlew :androidApp:printLibboxCompileClasspath --no-daemon 2>&1 | tee /tmp/cp.log || true

          echo ""
          echo "### LIBBOX entries from Gradle ###"
          grep -E "^LIBBOX_(COMPONENT|FILE|IS_)" /tmp/cp.log || echo "(no LIBBOX_ lines)"

          echo ""
          echo "### CP_ENTRY lines mentioning libbox ###"
          grep -i "libbox" /tmp/cp.log | grep "^CP_ENTRY:" || echo "(none)"

          echo ""
          echo "### All CP_ENTRY paths (first 40) ###"
          grep "^CP_ENTRY:" /tmp/cp.log | head -40 || echo "(none)"

          echo ""
          echo "### Searching CP_ENTRY paths for RoutePrefix.class ###"
          FOUND_JAR=""
          while IFS= read -r line; do
            p="${line#CP_ENTRY: }"
            [ -z "$p" ] && continue
            [ ! -e "$p" ] && continue

            if [ -f "$p" ]; then
              if unzip -l "$p" 2>/dev/null | grep -q "nekohasekai/libbox/RoutePrefix.class"; then
                FOUND_JAR="$p"; echo "HIT(file): $p"; break
              fi
              if unzip -l "$p" 2>/dev/null | grep -q "classes.jar"; then
                rm -rf /tmp/aar_x && mkdir -p /tmp/aar_x
                unzip -o "$p" "classes.jar" -d /tmp/aar_x > /dev/null 2>&1 || true
                if [ -f /tmp/aar_x/classes.jar ] && \
                   unzip -l /tmp/aar_x/classes.jar 2>/dev/null | grep -q "nekohasekai/libbox/RoutePrefix.class"; then
                  FOUND_JAR="/tmp/aar_x/classes.jar"; echo "HIT(aar-extracted): $p"; break
                fi
              fi
            elif [ -d "$p" ]; then
              while IFS= read -r jar; do
                if unzip -l "$jar" 2>/dev/null | grep -q "nekohasekai/libbox/RoutePrefix.class"; then
                  FOUND_JAR="$jar"; echo "HIT(dir): $jar"; break 2
                fi
              done < <(find "$p" -name "*.jar" -type f 2>/dev/null)
            fi
          done < <(grep "^CP_ENTRY:" /tmp/cp.log)

          if [ -z "$FOUND_JAR" ]; then
            echo ""
            echo "### Fallback: searching transforms for any nekohasekai/libbox .class ###"
            SAMPLE_JAR=""
            while IFS= read -r jar; do
              if unzip -l "$jar" 2>/dev/null | grep -q "nekohasekai/libbox/"; then
                SAMPLE_JAR="$jar"
                echo "SAMPLE: $jar"
                unzip -l "$jar" 2>/dev/null | grep "nekohasekai/libbox/" | head -30
                break
              fi
            done < <(find ~/.gradle/caches -name "*.jar" -type f 2>/dev/null | head -3000)
            FOUND_JAR="$SAMPLE_JAR"
          fi

          if [ -z "$FOUND_JAR" ]; then
            echo "::error::RoutePrefix.class not found anywhere"
            echo "--- Listing all libbox-named files in Gradle cache ---"
            find ~/.gradle/caches -iname "*libbox*" 2>/dev/null | head -40
            exit 0
          fi

          echo ""
          echo "=========================================="
          echo "FOUND_JAR=$FOUND_JAR"
          echo "=========================================="
          echo ""
          echo "### javap io.nekohasekai.libbox.RoutePrefix ###"
          javap -classpath "$FOUND_JAR" -p io.nekohasekai.libbox.RoutePrefix 2>&1 || echo "(javap failed)"
          echo ""
          echo "### javap io.nekohasekai.libbox.RoutePrefixIterator ###"
          javap -classpath "$FOUND_JAR" -p io.nekohasekai.libbox.RoutePrefixIterator 2>&1 || echo "(javap failed)"
          echo ""
          echo "### javap io.nekohasekai.libbox.TunOptions ###"
          javap -classpath "$FOUND_JAR" -p io.nekohasekai.libbox.TunOptions 2>&1 || echo "(javap failed)"

      - name: Build debug APK
        shell: bash
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Package release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          SRC="$(find androidApp/build/outputs/apk/debug -name '*.apk' -type f | head -1)"
          test -n "$SRC"
          SHORT="$(echo "${{ inputs.sha }}" | cut -c1-8)"
          cp "$SRC" "release/Vara-NG-Device-Gate-${SHORT}.apk"
          (cd release && sha256sum *.apk > SHA256SUMS.txt)
          ls -lh release/
          cat release/SHA256SUMS.txt

      - name: Create prerelease in public build repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: Saeiddvc/Vara-NG-Build
        shell: bash
        run: |
          set -euo pipefail
          SHORT="$(echo "${{ inputs.sha }}" | cut -c1-8)"
          TAG="vara-ng-device-gate-${SHORT}"
          gh release delete "$TAG" --repo "$GH_REPO" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            --repo "$GH_REPO" \
            --target main \
            --title "Vara NG Device Gate — ${SHORT}" \
            --notes "Built from private source Saeiddvc/SaeidVPN-Android at ${{ inputs.sha }} (ref ${{ inputs.ref }})." \
            --prerelease \
            release/*.apk release/SHA256SUMS.txt
